name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review/reopened are required so a draft->ready or reopen transition
    # re-runs CI, which is what triggers the workflow_run-chained prowl-review (#64).
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Fails the build if any core runtime dependency introduces a
      # non-permissive (e.g. GPL/AGPL) license — PROWL-011 / LEGAL-002.
      - name: Audit dependency licenses
        run: npm run audit:licenses
