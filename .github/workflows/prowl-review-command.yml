# Drive prowl-review from PR comments (@prowl-review <command>) on the
# self-hosted Mac mini runner using the keyless Codex (ChatGPT subscription)
# provider (#45/#64). NO provider key is stored in GitHub: the subscription
# login lives only on the runner (via `codex login` into a dedicated CODEX_HOME),
# never a GitHub secret, and this workflow sets no PROWL_AI_KEY*.
#
# PUBLIC-REPO NOTE — this repo (prowl-tools/prowl) is PUBLIC:
#   - OpenAI's CI/CD auth guidance says, verbatim: "Do not use this workflow for
#     public or open-source repositories." GitHub also warns against self-hosted
#     runners on public repos: any PR can execute code on the runner.
#   - The ubuntu `resolve` job (no secrets) computes the fork/trust verdict; the
#     self-hosted `command` job's job-level same-repo `if:` gate is MANDATORY
#     here so a fork PR is never scheduled onto the runner. Codex itself also
#     runs `--sandbox read-only`. Do NOT drop the gate. (Only a PRIVATE repo
#     could.)
#
# Branded identity (#59): the org shares PROWL_APP_ID/PROWL_APP_PRIVATE_KEY with
# this repo, so the self-hosted command job mints an App installation token and
# the reply posts as prowl-review[bot] (mirrors the dogfood workflow in
# prowl-tools/prowl-code-review). Falls back to the default auto-provisioned
# GITHUB_TOKEN when the secrets are unset. The ubuntu resolve job keeps
# github.token.
name: prowl-review command

on:
  issue_comment:
    types: [created]

# Adding pull_request_review_comment enables inline questions/ignore replies, but
# every inline review comment then creates a workflow run.

permissions:
  pull-requests: write
  issues: write
  checks: write
  contents: read

jobs:
  resolve:
    # Only honor mentions from a trusted commenter (owner/member/collaborator).
    # This ubuntu job (no provider secrets) resolves the fork/trust verdict so the
    # self-hosted job below is only ever scheduled for a same-repo request.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      contains(github.event.comment.body, '@prowl-review')
    runs-on: ubuntu-latest
    # Serialize command resolution by PR too, so a burst of comments cannot race
    # ahead of the self-hosted command job for the same PR.
    concurrency:
      group: prowl-review-codex-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      trusted_head: ${{ steps.pr.outputs.trusted_head }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ github.event.issue.number }}"
          IFS=$'\t' read -r base_sha head_sha head_repo < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.base.sha, .head.sha, .head.repo.full_name] | @tsv'
          )
          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "head_repo=${head_repo}"
          } >> "$GITHUB_OUTPUT"
          if [ "${head_repo}" = "${GITHUB_REPOSITORY}" ]; then
            echo "trusted_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted_head=false" >> "$GITHUB_OUTPUT"
          fi

  command:
    needs: resolve
    # Same-repo gate: keeps fork PRs off the self-hosted runner. MANDATORY on
    # this public repo (see header). Do not remove.
    if: needs.resolve.outputs.trusted_head == 'true' && needs.resolve.outputs.head_repo == github.repository
    runs-on: [self-hosted, macOS, prowl-review]
    timeout-minutes: 30
    # Shared per-PR Codex group serializes commands with auto reviews of the same
    # PR. Keep this non-cancelling so auto-review pushes do not interrupt commands.
    concurrency:
      group: prowl-review-codex-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      PROWL_APP_CONFIGURED: ${{ secrets.PROWL_APP_ID != '' && secrets.PROWL_APP_PRIVATE_KEY != '' }}
    steps:
      # Branded identity (#59): mint an App installation token when PROWL_APP_ID
      # is set so the command reply posts as prowl-review[bot] with the App
      # avatar. The env flag is only a boolean; the private key is only handed
      # to the token action. Falls back to github-actions[bot].
      - name: Mint prowl-review app token
        id: app-token
        if: env.PROWL_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.PROWL_APP_ID }}
          private-key: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: prowl-base
          persist-credentials: false

      # Bootstrap only matters for the PR that introduces .prowl-review.yml: before
      # it merges, main has no trusted config yet. Copy a known-good config from the
      # pinned prowl-review action repo, never from the PR checkout.
      - name: Checkout bootstrap review config
        if: ${{ hashFiles('prowl-base/.prowl-review.yml') == '' }}
        uses: actions/checkout@v4
        with:
          repository: prowl-tools/prowl-code-review
          ref: 8a56424bce07b32d2374b647145a2dd0b4efc295
          path: prowl-review-config-bootstrap
          persist-credentials: false

      - name: Install bootstrap review config
        if: ${{ hashFiles('prowl-base/.prowl-review.yml') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp prowl-review-config-bootstrap/.prowl-review.yml prowl-base/.prowl-review.yml

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: pr-head
          persist-credentials: false

      # Pinned to the current codex-provider commit; repin to @v1 once a release
      # containing the codex provider (>0.3.0) ships.
      - uses: prowl-tools/prowl-code-review@e7f0431b7daf2cc818a003c5ac216f29e7da3c53
        with:
          mode: command
          # Keyless: no PROWL_AI_KEY* — auth is the runner's own `codex login`.
          ai-provider: codex
          workspace-path: ${{ github.workspace }}/pr-head
          # Model + effort are pinned in the trusted base-branch config.
          config-path: ${{ github.workspace }}/prowl-base/.prowl-review.yml
          guidelines-path: ${{ github.workspace }}/prowl-base
          # Branded App token when configured; otherwise the default Actions token.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          bot-login: ${{ steps.app-token.outputs.app-slug != '' && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
